name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Lint (analyze)
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build APK (debug)
        run: flutter build apk --debug
